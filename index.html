<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DASHBOARD CONTROLE DE QUALIDADE NOTURNO - FutFanatics</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --bg:#fff;--navy:#001C40;--accent:#A4FF00;--muted:#f5f6f7;
      --card-radius:12px;--card-shadow:0 6px 18px rgba(0,0,0,.08)
    }
    html,body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--navy);padding:18px}
    header{display:flex;gap:18px;margin-bottom:18px;align-items:center}
    .grid{display:grid;grid-template-columns:320px 1fr 420px;gap:18px}
    .card{background:#fff;border-radius:12px;box-shadow:var(--card-shadow);padding:16px}
    .kpi-large{font-size:48px;font-weight:800}
    .mini-item{display:flex;justify-content:space-between;padding:6px;background:var(--muted);border-radius:8px;font-size:13px}
    .small-title{font-size:13px;font-weight:700;margin-bottom:8px}
    @media(max-width:1100px){.grid{grid-template-columns:1fr}}
  </style>
</head>

<body>

<header>
  <div style="width:44px;height:44px;background:#001C40;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800">FUT</div>
  <div>
    <h1>DASHBOARD CONTROLE DE QUALIDADE NOTURNO</h1>
    <div style="font-size:13px;color:#666">Período: <span id="periodo-text">--</span></div>
  </div>
</header>

<div class="grid">

  <!-- LEFT -->
  <div>
    <div class="card">
      <div class="small-title">Peças Auditadas</div>
      <div class="kpi-large" id="kpi-pecas">--</div>
      <div id="kpi-taxa">--</div>
      <div id="kpi-taxa-qnt"></div>
      <div class="small-title" style="margin-top:12px">Categorias</div>
      <div id="categoria-list"></div>
    </div>
  </div>

  <!-- CENTER -->
  <div>
    <div class="card">
      <div class="small-title">Conferidas vs Auditadas</div>
      <canvas id="chart-checkin" height="140"></canvas>
    </div>
    <div class="card">
      <div class="small-title">Check-in por Categoria</div>
      <canvas id="chart-categories" height="140"></canvas>
    </div>
  </div>

  <!-- RIGHT -->
  <div>
    <div class="card">
      <div class="small-title">Linha do Tempo Mensal</div>
      <canvas id="chart-monthly" height="180"></canvas>
    </div>
    <div class="card">
      <div class="small-title">Resumo</div>
      <div id="resumo-list"></div>
    </div>
  </div>

</div>

<script>
const SHEET_ID="1RisWgpsGELH184pSKGB77axrCd7xMfVdBkeK3_HGWP0";
const gUrl=n=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`;

function n(v){
  if(!v)return 0;
  return Number(String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0
}

function load(url){
  return new Promise(r=>{
    Papa.parse(url,{download:true,header:true,skipEmptyLines:true,complete:x=>r(x.data)})
  })
}

let chartMonthly=null;

async function drawMonthly(){
  Papa.parse(gUrl("HISTÓRICO_ANUAL"),{
    download:true,header:true,skipEmptyLines:true,
    complete:r=>{
      const h=r.data;
      if(!h.length)return;

      const ctx=document.getElementById("chart-monthly");
      if(chartMonthly)chartMonthly.destroy();

      chartMonthly=new Chart(ctx,{
        data:{
          labels:h.map(x=>x.MES),
          datasets:[
            {type:"bar",data:h.map(x=>n(x.CONFERIDAS)),backgroundColor:"#4A90E2"},
            {type:"bar",data:h.map(x=>n(x.AUDITADAS)),backgroundColor:"#7ED321"},
            {type:"bar",data:h.map(x=>n(x["% NCONF"])),backgroundColor:"#D0021B",yAxisID:"yP"}
          ]
        },
        options:{
          plugins:{legend:{display:false}},
          scales:{
            y:{beginAtZero:true},
            yP:{beginAtZero:true,position:"right",grid:{drawOnChartArea:false}}
          }
        }
      })
    }
  })
}

async function init(){
  const [audit,checkin,ncr]=await Promise.all([
    load(gUrl("1")),load(gUrl("2")),load(gUrl("3"))
  ]);

  let totalAud=0,totalConf=0,totalNc=0;
  audit.forEach(r=>totalAud+=n(r["Peças Auditadas (dia) TOTAL"]));
  checkin.forEach(r=>totalConf+=n(r["CONFERIDAS TOTAL"]||r["CONFERIDAS"]));
  ncr.forEach(r=>totalNc+=n(r["QNTD"]));

  document.getElementById("kpi-pecas").innerText=totalAud.toLocaleString("pt-BR");
  document.getElementById("kpi-taxa").innerText=totalAud?((totalNc/totalAud)*100).toFixed(1)+"%":"0%";
  document.getElementById("kpi-taxa-qnt").innerText=`${totalNc} peças`;

  document.getElementById("resumo-list").innerHTML=`
    <div class="mini-item"><span>Conferidas</span><b>${totalConf}</b></div>
    <div class="mini-item"><span>Auditadas</span><b>${totalAud}</b></div>
  `;

  drawMonthly();
}

init();
</script>

</body>
</html>
