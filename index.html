<body>
<!-- TODO O HTML ORIGINAL — NÃO ALTERADO -->

<!-- ================= SCRIPT ================= -->
<script>
const SHEET_ID = "1RisWgpsGELH184pSKGB77axrCd7xMfVdBkeK3_HGWP0";

function gsheetCsvUrl(sheet){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}`;
}

/* ================= LINHA DO TEMPO MENSAL — FUNCIONAL ================= */
let chartMonthly = null;

function drawMonthlyTimeline(){
  Papa.parse(gsheetCsvUrl("HISTÓRICO_ANUAL"),{
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      const h = res.data;
      if(!h.length) return;

      const labels = h.map(r=>r.MES);
      const conferidas = h.map(r=>Number(r.CONFERIDAS||0));
      const auditadas = h.map(r=>Number(r.AUDITADAS||0));
      const pctNconf = h.map(r=>Number(String(r["% NCONF"]||"0").replace("%","").replace(",",".")));

      const ctx = document.getElementById("chart-monthly").getContext("2d");
      if(chartMonthly) chartMonthly.destroy();

      chartMonthly = new Chart(ctx,{
        data:{
          labels,
          datasets:[
            {type:"bar",label:"Conferidas",data:conferidas,backgroundColor:"#1976d2",yAxisID:"y"},
            {type:"bar",label:"Auditadas",data:auditadas,backgroundColor:"#0b5f3a",yAxisID:"y"},
            {type:"bar",label:"% NCONF",data:pctNconf,backgroundColor:"#d0021b",yAxisID:"yP"}
          ]
        },
        options:{
          responsive:true,
          plugins:{legend:{display:false}},
          scales:{
            y:{beginAtZero:true},
            yP:{beginAtZero:true,position:"right",grid:{drawOnChartArea:false}}
          }
        }
      });
    }
  });
}

/* ================= INIT ================= */
async function init(){
  // todo o seu init original continua aqui
  drawMonthlyTimeline(); // ← única linha adicionada
}

init();
</script>
</body>
</html>
